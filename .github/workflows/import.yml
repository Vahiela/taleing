name: Import pinned Excalidraw source

on:
  push:
    branches: [main]
    paths: [taleing-import.patch]

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Import upstream history and apply Taleing changes
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: 2c3dcc06ec807e81ab9437eceb1a8f7a3c590743
        run: |
          set -euo pipefail
          original_head=$(git rev-parse HEAD)
          cp taleing-import.patch "$RUNNER_TEMP/taleing-import.patch"
          cp .github/workflows/import.yml "$RUNNER_TEMP/import.yml"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/excalidraw/excalidraw.git "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git switch --detach "$UPSTREAM_SHA"
          git merge --strategy=ours --allow-unrelated-histories "$original_head" -m "Import pinned Excalidraw source and history"
          git apply --index "$RUNNER_TEMP/taleing-import.patch"
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/import.yml" .github/workflows/import.yml
          git add .github/workflows/import.yml
          git commit -m "Configure Taleing for GitHub Pages"
          git push origin HEAD:refs/heads/main
          gh workflow run pages.yml --ref main
